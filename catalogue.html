<style>

    .cat-page{
      color-scheme: light dark;
      --bg: #edf2f0;
      --surface: #ffffff;
      --surface-2: #e3ece9;
      --ink: #171a19;
      --muted: #59635f;
      --line: rgba(23,26,25,.14);
      --teal: #0d8f87;
      --teal-soft: #cfe9e5;
      --shadow: 0 24px 70px rgba(18,40,36,.16), 0 3px 12px rgba(18,40,36,.10);
      --focus: #087a74;
    }
    @media (prefers-color-scheme: dark) {.cat-page{
        --bg: #e4ebe8;
        --surface: #fdfefd;
        --surface-2: #d9e5e1;
        --ink: #121615;
        --muted: #4e5b57;
        --line: rgba(18,22,21,.18);
        --teal: #087f78;
        --teal-soft: #c5e2dd;
        --shadow: 0 28px 80px rgba(8,31,27,.22), 0 3px 16px rgba(8,31,27,.13);
        --focus: #066e69;
      }
    }
    .cat-page *{ box-sizing: border-box; }
    .cat-page{ min-height: 100%; background: var(--bg); }
    .cat-page{
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Aptos", "Segoe UI", Helvetica, sans-serif;
      overflow-x: hidden;
    }
    .cat-page button, .cat-page a{ font: inherit; }
    .cat-page button{ color: inherit; }
    .cat-page :focus-visible{ outline: 3px solid var(--focus); outline-offset: 3px; }
    .cat-page .app{
      min-height: 100vh;
      min-height: 100dvh;
      padding: clamp(14px, 2.5vw, 30px);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: clamp(12px, 2vh, 22px);
    }
    .cat-page .utility{
      width: min(1120px, 100%);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .cat-page .position{
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 9px;
    }
    .cat-page .position strong{
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(18px, 2vw, 24px);
      font-weight: 500;
      line-height: 1;
    }
    .cat-page .position span{ color: var(--muted); font-size: 13px; white-space: nowrap; }
    .cat-page .toolset{ display: flex; align-items: center; gap: 7px; }
    .cat-page .icon-btn, .cat-page .text-btn{
      border: 1px solid var(--line);
      background: var(--surface);
      min-height: 42px;
      border-radius: 999px;
      cursor: pointer;
      transition: background .18s ease, border-color .18s ease, color .18s ease;
    }
    .cat-page .icon-btn{ width: 42px; display: grid; place-items: center; padding: 0; }
    .cat-page .text-btn{ padding: 0 16px; font-weight: 650; font-size: 14px; }
    .cat-page .icon-btn:hover, .cat-page .text-btn:hover{ background: var(--surface-2); border-color: color-mix(in srgb, var(--line), var(--ink) 20%); }
    .cat-page .icon-btn svg{ width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; }
    .cat-page .reader{
      min-height: 0;
      display: grid;
      align-items: center;
      justify-items: center;
      position: relative;
      perspective: 1800px;
      width: min(1320px, 100%);
      margin: 0 auto;
    }
    .cat-page .page-wrap{
      position: relative;
      width: min(100%, calc((100vh - 190px) * 1.464));
      width: min(100%, calc((100dvh - 190px) * 1.464));
      aspect-ratio: 2516 / 1719;
      transform-style: preserve-3d;
    }
    .cat-page .page-wrap::before{
      content: "";
      position: absolute;
      z-index: -1;
      inset: 8% -2.5% -4%;
      background: rgba(16,70,62,.18);
      filter: blur(24px);
      border-radius: 50%;
    }
    .cat-page .page{
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #fff;
      box-shadow: var(--shadow);
      border-radius: 2px 7px 7px 2px;
      user-select: none;
      -webkit-user-drag: none;
      backface-visibility: hidden;
      transform-origin: left center;
    }
    .cat-page .page.next{ z-index: 1; }
    .cat-page .page.current{ z-index: 2; }
    .cat-page .page.turning-next{ z-index: 3; animation: turnNext .58s cubic-bezier(.5,.02,.28,1) forwards; }
    .cat-page .page.turning-prev{ z-index: 3; transform-origin: right center; animation: turnPrev .58s cubic-bezier(.5,.02,.28,1) forwards; }
    @keyframes turnNext {
      0% { transform: rotateY(0deg); filter: brightness(1); }
      45% { transform: rotateY(-76deg); filter: brightness(.72); }
      100% { transform: rotateY(-179deg); filter: brightness(.54); }
    }
    @keyframes turnPrev {
      0% { transform: rotateY(0deg); filter: brightness(1); }
      45% { transform: rotateY(76deg); filter: brightness(.72); }
      100% { transform: rotateY(179deg); filter: brightness(.54); }
    }
    .cat-page .edge{
      position: absolute;
      z-index: 4;
      top: 0;
      bottom: 0;
      width: clamp(42px, 8vw, 90px);
      border: 0;
      background: transparent;
      cursor: pointer;
      opacity: 0;
    }
    .cat-page .edge:hover{ opacity: 1; }
    .cat-page .edge::after{
      content: "";
      position: absolute;
      top: 50%;
      width: 13px;
      height: 13px;
      border-top: 2px solid white;
      border-right: 2px solid white;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,.7));
    }
    .cat-page .edge.prev{ left: 0; background: linear-gradient(90deg, rgba(0,0,0,.25), transparent); }
    .cat-page .edge.next{ right: 0; background: linear-gradient(-90deg, rgba(0,0,0,.25), transparent); }
    .cat-page .edge.prev::after{ left: 22px; transform: translateY(-50%) rotate(-135deg); }
    .cat-page .edge.next::after{ right: 22px; transform: translateY(-50%) rotate(45deg); }
    .cat-page .edge:disabled{ display: none; }
    .cat-page .controls{
      width: min(740px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: auto minmax(120px, 1fr) auto;
      align-items: center;
      gap: 14px;
    }
    .cat-page .nav-btn{
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 10px;
      height: 48px;
      min-width: 110px;
      padding: 0 18px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .cat-page .nav-btn:hover:not(:disabled){ background: var(--surface-2); }
    .cat-page .nav-btn:disabled{ opacity: .34; cursor: default; }
    .cat-page .nav-btn svg{ width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }
    .cat-page .progress-wrap{ display: grid; gap: 7px; }
    .cat-page .progress-label{ color: var(--muted); font-size: 12px; text-align: center; font-variant-numeric: tabular-nums; }
    .cat-page .track{
      position: relative;
      height: 4px;
      overflow: hidden;
      border-radius: 4px;
      background: var(--surface-2);
    }
    .cat-page .track span{ display: block; height: 100%; width: 3.85%; background: var(--teal); }
    .cat-page dialog{
      width: min(900px, calc(100% - 28px));
      max-height: min(760px, calc(100dvh - 28px));
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 0;
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 28px 90px rgba(0,0,0,.48);
    }
    .cat-page dialog::backdrop{ background: rgba(6,8,7,.76); }
    .cat-page .toc-head{
      position: sticky;
      top: 0;
      z-index: 3;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
    }
    .cat-page .toc-head h2{ margin: 0; font-family: Georgia, "Times New Roman", serif; font-weight: 500; font-size: 25px; }
    .cat-page .toc-grid{
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 10px;
      padding: 16px;
    }
    .cat-page .toc-item{
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0;
      overflow: hidden;
      background: transparent;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      min-width: 0;
    }
    .cat-page .toc-item:hover{ border-color: var(--teal); }
    .cat-page .thumb{ display: block; width: 100%; aspect-ratio: 2516/1719; object-fit: cover; background: #fff; }
    .cat-page .toc-copy{ padding: 10px 11px 12px; display: grid; gap: 3px; }
    .cat-page .toc-copy b{ font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cat-page .toc-copy small{ color: var(--muted); }
    .cat-page .hint{ position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); color: white; background: rgba(0,0,0,.68); padding: 8px 12px; border-radius: 999px; font-size: 12px; pointer-events: none; opacity: 0; transition: opacity .2s; }
    .cat-page .hint.show{ opacity: 1; }
    @media (max-width: 680px) {.cat-page .app{ padding: 10px 10px 14px; gap: 10px; }.cat-page .utility{ padding: 0 2px; }.cat-page .position strong{ font-size: 18px; }.cat-page .position span{ font-size: 12px; }.cat-page .text-btn span{ display: none; }.cat-page .text-btn{ width: 42px; padding: 0; }.cat-page .reader{ align-self: center; }.cat-page .page-wrap{
        width: 100%;
        max-height: calc(100dvh - 168px);
      }.cat-page .edge{ display: none; }.cat-page .controls{ grid-template-columns: 48px minmax(100px,1fr) 48px; gap: 9px; }.cat-page .nav-btn{ min-width: 48px; width: 48px; padding: 0; height: 46px; }.cat-page .nav-btn span{ display: none; }.cat-page .toc-grid{ grid-template-columns: repeat(2, minmax(0,1fr)); padding: 10px; }.cat-page .toc-head{ padding: 14px; }.cat-page dialog{ border-radius: 14px; }
    }
    @media (max-height: 560px) and (orientation: landscape) {.cat-page .app{ grid-template-columns: 1fr; grid-template-rows: auto minmax(0,1fr) auto; padding: 8px 12px; gap: 7px; }.cat-page .page-wrap{ width: min(88vw, calc((100dvh - 126px) * 1.464)); }.cat-page .icon-btn, .cat-page .text-btn{ min-height: 34px; height: 34px; }.cat-page .nav-btn{ height: 38px; }.cat-page .controls{ width: min(620px, 100%); }
    }
    @media (prefers-reduced-motion: reduce) {.cat-page *, .cat-page *::before, .cat-page *::after{ scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  
</style>

<body data-page="catalogue">
<div id="site-header"></div>
<main>
<div class="cat-page">

  <main class="app">
    <div class="utility">
      <div class="position" aria-live="polite">
        <strong id="sectionTitle">Cover</strong>
        <span id="pageCount">1 / 26</span>
      </div>
      <div class="toolset">
        <button class="text-btn" id="contentsBtn" type="button" aria-label="Open contents">
          <span>Contents</span>
          <svg aria-hidden="true" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <button class="icon-btn" id="firstBtn" type="button" aria-label="Go to cover" title="Go to cover">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 5v14M19 6l-8 6 8 6z"/></svg>
        </button>
      </div>
    </div>

    <section class="reader" aria-label="RTA Kitchen Collection catalogue viewer">
      <div class="page-wrap" id="pageWrap">
        <img class="page next" id="nextPage" src="assets/catalogue/pages/page-02.jpg" alt="Catalogue page 2 of 26" />
        <img class="page current" id="currentPage" src="assets/catalogue/pages/page-01.jpg" alt="Renofy RTA Kitchen Collection cover, page 1 of 26" />
        <button class="edge prev" id="edgePrev" type="button" aria-label="Previous page"></button>
        <button class="edge next" id="edgeNext" type="button" aria-label="Next page"></button>
      </div>
    </section>

    <nav class="controls" aria-label="Catalogue navigation">
      <button class="nav-btn" id="prevBtn" type="button" aria-label="Previous page">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg><span>Previous</span>
      </button>
      <div class="progress-wrap">
        <div class="progress-label" id="progressLabel">Page 1 of 26</div>
        <div class="track" aria-hidden="true"><span id="progressBar"></span></div>
      </div>
      <button class="nav-btn" id="nextBtn" type="button" aria-label="Next page">
        <span>Next</span><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </nav>
  </main>

  <dialog id="contentsDialog" aria-labelledby="contentsTitle">
    <div class="toc-head">
      <h2 id="contentsTitle">Contents</h2>
      <button class="icon-btn" id="closeContents" type="button" aria-label="Close contents">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="toc-grid" id="tocGrid"></div>
  </dialog>
  <div class="hint" id="hint" role="status">Swipe or use arrow keys to turn pages</div>

  <script>
    (function () {
      'use strict';
      var total = 26;
      var page = 1;
      var busy = false;
      var touchStartX = 0;
      var touchStartY = 0;
      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var entries = [
        [1,'Cover'],[2,'The RTA Kitchen Collection'],[3,'Contents'],[4,'Why Renofy RTA'],
        [5,'How It Works'],[6,'Cabinet Construction'],[7,'Finishes — 2-Day Pick-Up'],
        [8,'Essential Series'],[9,'Essential Plus Series'],[10,'Trend Series'],
        [11,'Premium Series'],[12,'Elite Series'],[13,'Finishes — 5-Day Pick-Up'],
        [14,'Urban Select Series'],[15,'Signature Prestige Series'],[16,'Cabinet Specifications'],
        [26,'Warranty & Next Steps']
      ];
      var current = document.getElementById('currentPage');
      var next = document.getElementById('nextPage');
      var wrap = document.getElementById('pageWrap');
      var prevBtn = document.getElementById('prevBtn');
      var nextBtn = document.getElementById('nextBtn');
      var edgePrev = document.getElementById('edgePrev');
      var edgeNext = document.getElementById('edgeNext');
      var dialog = document.getElementById('contentsDialog');

      function src(n) { return 'assets/catalogue/pages/page-' + String(n).padStart(2,'0') + '.jpg'; }
      function titleFor(n) {
        var exact = entries.find(function (e) { return e[0] === n; });
        if (exact) return exact[1];
        if (n > 16 && n < 26) return 'Cabinet Specifications';
        return 'RTA Kitchen Collection';
      }
      function altFor(n) { return titleFor(n) + ', catalogue page ' + n + ' of ' + total; }
      function paint() {
        current.src = src(page);
        current.alt = altFor(page);
        document.getElementById('sectionTitle').textContent = titleFor(page);
        document.getElementById('pageCount').textContent = page + ' / ' + total;
        document.getElementById('progressLabel').textContent = 'Page ' + page + ' of ' + total;
        document.getElementById('progressBar').style.width = ((page / total) * 100) + '%';
        prevBtn.disabled = page === 1;
        nextBtn.disabled = page === total;
        edgePrev.disabled = page === 1;
        edgeNext.disabled = page === total;
        var preload = new Image();
        preload.src = src(page < total ? page + 1 : page - 1);
      }
      function go(target, direction) {
        target = Math.max(1, Math.min(total, target));
        if (target === page) return;
        direction = direction || (target > page ? 'next' : 'prev');
        var oldPage = current.cloneNode(true);
        oldPage.removeAttribute('id');
        oldPage.className = 'page ' + (direction === 'next' ? 'turning-next' : 'turning-prev');
        wrap.insertBefore(oldPage, edgePrev);
        page = target;
        paint();
        window.setTimeout(function () { oldPage.remove(); }, reduced ? 20 : 590);
      }
      function buildContents() {
        var grid = document.getElementById('tocGrid');
        entries.forEach(function (entry) {
          var button = document.createElement('button');
          button.type = 'button';
          button.className = 'toc-item';
          button.innerHTML = '<img class="thumb" loading="lazy" src="' + src(entry[0]) + '" alt="" />' +
            '<span class="toc-copy"><b>' + entry[1] + '</b><small>Page ' + entry[0] + '</small></span>';
          button.addEventListener('click', function () {
            dialog.close();
            go(entry[0]);
          });
          grid.appendChild(button);
        });
      }
      prevBtn.addEventListener('click', function () { go(page - 1, 'prev'); });
      nextBtn.addEventListener('click', function () { go(page + 1, 'next'); });
      edgePrev.addEventListener('click', function () { go(page - 1, 'prev'); });
      edgeNext.addEventListener('click', function () { go(page + 1, 'next'); });
      document.getElementById('firstBtn').addEventListener('click', function () { go(1, 'prev'); });
      document.getElementById('contentsBtn').addEventListener('click', function () { dialog.showModal(); });
      document.getElementById('closeContents').addEventListener('click', function () { dialog.close(); });
      dialog.addEventListener('click', function (e) {
        var r = dialog.getBoundingClientRect();
        if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) dialog.close();
      });
      document.addEventListener('keydown', function (e) {
        if (dialog.open) return;
        if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); go(page + 1, 'next'); }
        if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(page - 1, 'prev'); }
        if (e.key === 'Home') { e.preventDefault(); go(1, 'prev'); }
        if (e.key === 'End') { e.preventDefault(); go(total, 'next'); }
      });
      wrap.addEventListener('touchstart', function (e) {
        touchStartX = e.changedTouches[0].clientX;
        touchStartY = e.changedTouches[0].clientY;
      }, {passive:true});
      wrap.addEventListener('touchend', function (e) {
        var dx = e.changedTouches[0].clientX - touchStartX;
        var dy = e.changedTouches[0].clientY - touchStartY;
        if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.25) {
          if (dx < 0) go(page + 1, 'next'); else go(page - 1, 'prev');
        }
      }, {passive:true});
      buildContents();
      paint();
      var hint = document.getElementById('hint');
      window.setTimeout(function () { hint.classList.add('show'); }, 500);
      window.setTimeout(function () { hint.classList.remove('show'); }, 3200);
    }());
  </script>

</div>
